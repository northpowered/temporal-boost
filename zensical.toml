# Shared portal settings. Locale configs are generated by scripts/docs/build_portal.py.
[project]
site_name = "Temporal-boost"
repo_url = "https://github.com/northpowered/temporal-boost"
repo_name = "northpowered/temporal-boost"
edit_uri = "edit/main/docs/"
use_directory_urls = true
extra_css = ["assets/stylesheets/tokens.css", "assets/stylesheets/temporal.css"]
extra_javascript = ["assets/javascripts/language.js"]
copyright = "Temporal-boost · Temporal brand assets used under the Temporal brand guidelines"

[project.theme]
variant = "modern"
font = false
logo = "assets/brand/temporal-light.svg"
favicon = "assets/brand/temporal-dark.svg"
features = ["navigation.tabs", "navigation.sections", "navigation.tracking", "navigation.footer", "content.code.copy", "content.action.edit", "content.tabs.link"]

[project.theme.icon]
repo = "material/github"
alternate = "material/translate"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[project.plugins.tags]

[project.markdown_extensions]
tables = {}
attr_list = {}
md_in_html = {}
admonition = {}
"pymdownx.details" = {}
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = { check_paths = true }
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true }
toc = { permalink = true }
